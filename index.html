<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mobilidadeBR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C96A2E' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Ccircle cx='12' cy='4' r='1.3' fill='%23C96A2E'/%3E%3Cpath d='M9 7h6M11 7v4l-3 6M13 11l3 6M11 11h5'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#topo"><i data-lucide="accessibility"></i> <span class="marca-mobilidade">mobilidade</span><span class="marca-br">BR</span></a>
  <div class="topbar-controls">
    <select id="lang-toggle" aria-label="Idioma / Language">
      <option value="pt">PT-BR</option>
      <option value="en">English</option>
    </select>
    <button id="theme-toggle" aria-label="Alternar tema claro/escuro"><i data-lucide="sun-moon"></i></button>
  </div>
</header>

<section class="hero" id="topo">
  <div class="hero-inner">
    <div class="eyebrow" data-i18n="hero_eyebrow"></div>
    <h1 data-i18n="hero_titulo"></h1>
    <p class="hero-sub" data-i18n="hero_subtitulo"></p>

    <div class="hero-ctas">
      <a class="botao-primario" href="#lugares"><i data-lucide="map-pin"></i> <span data-i18n="hero_cta_lugares"></span></a>
      <a class="hero-cta-secundaria" href="#cidade" data-i18n="hero_cta_secundaria"></a>
    </div>

    <div class="hero-stats">
      <div class="hero-stat"><span class="v" id="stat-lugares">—</span><span class="l" data-i18n="hero_s1"></span></div>
      <div class="hero-stat"><span class="v" id="stat-cidades">—</span><span class="l" data-i18n="hero_s2"></span></div>
      <div class="hero-stat"><span class="v" id="stat-banheiros">—</span><span class="l" data-i18n="hero_s3"></span></div>
      <div class="hero-stat"><span class="v" id="stat-municipios">—</span><span class="l" data-i18n="hero_s4"></span></div>
    </div>
  </div>
</section>

<nav class="chip-nav" aria-label="Seções">
  <a class="chip-link" data-section="lugares" href="#lugares"><i data-lucide="map-pin"></i> <span data-i18n="nav_lugares"></span></a>
  <a class="chip-link" data-section="viagem" href="#viagem"><i data-lucide="plane"></i> <span data-i18n="nav_viagem"></span></a>
  <a class="chip-link" data-section="cidade" href="#cidade"><i data-lucide="building-2"></i> <span data-i18n="nav_cidade"></span></a>
</nav>

<div class="aviso-faixa">
  <i data-lucide="info"></i>
  <div><b data-i18n="honestidade_titulo"></b> — <span data-i18n="honestidade_texto"></span></div>
</div>

<!-- LUGARES ACESSÍVEIS -->
<section id="lugares" class="secao">
  <div class="secao-head">
    <div class="eyebrow" data-i18n="lugares_eyebrow"></div>
    <h2 id="lugares-titulo"></h2>
    <p class="secao-caption" data-i18n="lugares_caption"></p>
  </div>

  <div class="seletor-cidade-linha">
    <label for="seletor-cidade" class="seletor-cidade-label"><i data-lucide="map-pin"></i> <span data-i18n="lugares_cidade_label"></span></label>
    <select id="seletor-cidade"></select>
  </div>

  <div id="mapa-lugares" class="mapa-explorar"></div>

  <div class="legenda" id="legenda-lugares"></div>

  <p class="secao-caption" data-i18n="lugares_escolha_categoria"></p>
  <div class="categorias-grid" id="categorias-grid"></div>

  <div class="detalhe-categoria" id="detalhe-categoria" hidden>
    <button class="botao-voltar" id="btn-voltar-categoria" type="button"><i data-lucide="arrow-left"></i> <span data-i18n="lugares_voltar"></span></button>
    <h3 class="detalhe-categoria-titulo" id="detalhe-categoria-titulo"></h3>

    <div class="controles-lugares">
      <div class="controles-linha2">
        <div class="busca-mini"><i data-lucide="search"></i><input id="filtro-nome" type="text" data-i18n-placeholder="lugares_busca_nome"></div>
        <label class="toggle"><input type="checkbox" id="filtro-so-info"><span class="toggle-track"></span><span data-i18n="lugares_so_com_info"></span></label>
      </div>
    </div>

    <div class="grid-lugares" id="grid-lugares"></div>
  </div>

  <div class="aviso-card"><i data-lucide="info"></i> <span data-i18n-html="lugares_aviso"></span></div>
</section>

<!-- ANTES DE VIAJAR -->
<section id="viagem" class="secao secao-tintada">
  <div class="secao-head">
    <div class="eyebrow" data-i18n="viagem_eyebrow"></div>
    <h2 data-i18n="viagem_titulo"></h2>
  </div>
  <div class="grid-editorial">
    <article class="cartao-editorial cartao-laranja">
      <i data-lucide="plane" class="cartao-icone"></i>
      <h3 data-i18n="viagem_aeroporto_titulo"></h3>
      <div class="cartao-sub" data-i18n="viagem_aeroporto_sub"></div>
      <div data-i18n-html="viagem_aeroporto_md"></div>
    </article>
  </div>

  <div class="seletor-cidade-linha">
    <label for="seletor-cidade-viagem" class="seletor-cidade-label"><i data-lucide="map-pin"></i> <span data-i18n="lugares_cidade_label"></span></label>
    <select id="seletor-cidade-viagem"></select>
  </div>

  <h3 id="viagem-cidade-titulo" class="viagem-cidade-titulo"></h3>
  <div class="grid-editorial" id="viagem-cidade-cards"></div>

  <p class="secao-caption" data-i18n="viagem_fontes"></p>
</section>

<!-- MINHA CIDADE -->
<section id="cidade" class="secao">
  <div class="secao-head">
    <div class="eyebrow" data-i18n="cidade_eyebrow"></div>
    <h2 data-i18n="cidade_titulo"></h2>
  </div>

  <form class="busca-municipio" id="form-busca-municipio">
    <i data-lucide="search"></i>
    <input id="busca-municipio" type="text" list="lista-municipios" data-i18n-placeholder="cidade_busca_placeholder" autocomplete="off">
    <datalist id="lista-municipios"></datalist>
    <button type="submit" data-i18n="cidade_busca_botao"></button>
  </form>
  <p class="hero-busca-erro" id="busca-municipio-erro"></p>

  <div id="resultado-cidade"></div>
</section>

<footer class="rodape">
  <p><span data-i18n="rodape_texto"></span> <a href="https://github.com/Anajaraa/mapa-da-equidade" target="_blank" rel="noopener" data-i18n="rodape_link"></a>.</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
