<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acessível SP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230B5FB0' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Ccircle cx='12' cy='4' r='1.3' fill='%230B5FB0'/%3E%3Cpath d='M9 7h6M11 7v4l-3 6M13 11l3 6M11 11h5'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand"><i data-lucide="accessibility"></i> Acessível SP</span>
    <div class="topbar-controls">
      <select id="lang-toggle" aria-label="Idioma / Language">
        <option value="pt">PT-BR</option>
        <option value="en">English</option>
      </select>
      <button id="theme-toggle" aria-label="Alternar tema claro/escuro"><i data-lucide="sun-moon"></i></button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1><i data-lucide="accessibility" class="icon-hero"></i> <span data-i18n="titulo"></span></h1>
    <p data-i18n="subtitulo"></p>
    <div class="hero-stats">
      <div class="hero-stat"><div class="v">326</div><div class="l" data-i18n="hero_s1"></div></div>
      <div class="hero-stat"><div class="v">45</div><div class="l" data-i18n="hero_s2"></div></div>
      <div class="hero-stat"><div class="v">11.241</div><div class="l" data-i18n="hero_s3"></div></div>
      <div class="hero-stat"><div class="v">5.570</div><div class="l" data-i18n="hero_s4"></div></div>
    </div>
  </div>
</section>

<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="inicio"><i data-lucide="home"></i> <span data-i18n="tab_inicio"></span></button>
  <button class="tab" data-tab="lugares"><i data-lucide="map-pin"></i> <span data-i18n="tab_lugares"></span></button>
  <button class="tab" data-tab="viagem"><i data-lucide="plane"></i> <span data-i18n="tab_viagem"></span></button>
  <button class="tab" data-tab="cidade"><i data-lucide="building-2"></i> <span data-i18n="tab_cidade"></span></button>
  <button class="tab" data-tab="brasil"><i data-lucide="map"></i> <span data-i18n="tab_brasil"></span></button>
</nav>

<main class="container">

  <!-- INÍCIO -->
  <section id="panel-inicio" class="panel active">
    <h2 data-i18n="inicio_titulo"></h2>
    <div class="grid-3">
      <div class="card-box"><h4><i data-lucide="map-pin"></i> <span data-i18n="inicio_lugares_t"></span></h4><p data-i18n="inicio_lugares_d"></p></div>
      <div class="card-box"><h4><i data-lucide="plane"></i> <span data-i18n="inicio_viagem_t"></span></h4><p data-i18n="inicio_viagem_d"></p></div>
      <div class="card-box"><h4><i data-lucide="building-2"></i> <span data-i18n="inicio_cidade_t"></span></h4><p data-i18n="inicio_cidade_d"></p></div>
    </div>
    <div class="aviso-card">
      <b><i data-lucide="info"></i> <span data-i18n="inicio_honestidade_titulo"></span></b><br>
      <span data-i18n="inicio_honestidade_texto"></span>
    </div>
  </section>

  <!-- LUGARES ACESSÍVEIS -->
  <section id="panel-lugares" class="panel">
    <h2 data-i18n="lugares_titulo"></h2>
    <p class="caption" data-i18n="lugares_caption"></p>

    <div class="stat-row" id="lugares-stats"></div>
    <p class="caption" id="lugares-rest-caption"></p>

    <div class="aviso-card"><i data-lucide="info"></i> <span data-i18n="lugares_aviso"></span></div>

    <div class="panel-box">
      <div class="filtros-row">
        <select id="filtro-categoria" multiple></select>
        <input id="filtro-nome" type="text" data-i18n-placeholder="lugares_busca_nome">
        <label class="checkbox-label"><input type="checkbox" id="filtro-so-info"> <span data-i18n="lugares_so_com_info"></span></label>
      </div>
      <div class="map-table-grid">
        <div id="mapa-lugares" class="mapa"></div>
        <div class="tabela-wrap">
          <table id="tabela-lugares">
            <thead><tr>
              <th data-i18n="col_foto"></th><th data-i18n="col_ponto"></th>
              <th data-i18n="col_categoria"></th><th data-i18n="col_acess"></th><th data-i18n="col_banheiro"></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="legenda" id="legenda-lugares"></div>
    </div>

    <div class="panel-box">
      <h3 data-i18n="ruas_titulo"></h3>
      <div class="stat-row" id="ruas-stats"></div>
      <p class="caption" data-i18n="ruas_caption"></p>
      <div id="mapa-ruas" class="mapa"></div>
    </div>
  </section>

  <!-- ANTES DE VIAJAR -->
  <section id="panel-viagem" class="panel">
    <h2 data-i18n="viagem_titulo"></h2>
    <div class="grid-2">
      <div class="panel-box">
        <h4 data-i18n="viagem_aeroporto_titulo"></h4>
        <div data-i18n-html="viagem_aeroporto_md"></div>
      </div>
      <div class="panel-box">
        <h4 data-i18n="viagem_transporte_titulo"></h4>
        <div data-i18n-html="viagem_transporte_md"></div>
      </div>
    </div>
    <p class="caption" data-i18n="viagem_fontes"></p>
  </section>

  <!-- MINHA CIDADE -->
  <section id="panel-cidade" class="panel">
    <h2 data-i18n="cidade_titulo"></h2>
    <p class="caption" data-i18n="cidade_caption"></p>
    <input id="busca-cidade" type="text" list="lista-cidades" data-i18n-placeholder="cidade_placeholder" autocomplete="off">
    <datalist id="lista-cidades"></datalist>
    <div id="resultado-cidade"></div>
  </section>

  <!-- PANORAMA NO BRASIL -->
  <section id="panel-brasil" class="panel">
    <h2 data-i18n="brasil_titulo"></h2>
    <p class="caption" data-i18n="brasil_caption"></p>
    <div class="panel-box">
      <h3 data-i18n="brasil_mapa_titulo"></h3>
      <div id="mapa-brasil" class="mapa" style="height:460px;"></div>
    </div>
    <div class="panel-box">
      <h3 data-i18n="brasil_regiao_titulo"></h3>
      <canvas id="grafico-regiao" height="140"></canvas>
    </div>
  </section>

</main>

<footer class="rodape">
  <p>Dados: IBGE (Censo 2022, MUNIC 2020), RAIS 2024, OpenStreetMap. Parte do projeto <a href="https://github.com/Anajaraa/mapa-da-equidade" target="_blank" rel="noopener">Mapa da Equidade</a>.</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
